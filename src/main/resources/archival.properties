# ---------------------------------------------------------------------------
# DESIGN CONFIGURATION
#
# Every value here is a decision recorded in the LLD. Changing one changes
# WHAT the archive contains, or WHEN. These need a review, not a redeploy.
# ---------------------------------------------------------------------------

# Where the documents are read from.
source.bucket=dom-ordersystem-prod-gcs-completed-orders
source.prefix=order-invoices/

# Where the tars are written. LLD open question 4 - location still to be decided.
archive.bucket=dom-invoice-archive-poc

# T-90. Only objects older than this are archived.
# The 90 is itself LLD open question 1: the "97% of reads in 90 days" figure
# behind it has no traceable source and is still to be re-derived.
cutoff.days=90

# Bundle shape. Production targets 6 GiB / 100,000 members; these are the LLD's
# staging values, which are what a laptop can actually demonstrate.
bundle.target.bytes=1073741824
bundle.max.members=20000

# How long member rows stay resident in Postgres before Snowflake is the index.
# 24 monthly partitions ~= 800 M rows at production volume.
members.retention.months=24

# Tar layout version - the format, not a folder name. Bumped only if the
# framing itself ever changes, so old bundles stay readable.
tar.layout.version=1

# Document kinds the Lister will archive. Still provisional: these cover every
# filename shape in order-invoices/, but not the legacy prefixes.
doc.kinds=INVOICE,CN_DN
doc.formats=pdf,html
