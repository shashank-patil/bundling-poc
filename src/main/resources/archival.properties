# ---------------------------------------------------------------------------
# DESIGN CONFIGURATION
#
# Mirrors the `archive:` block in LLD section 4.1. Every value here is a
# decision recorded in the LLD - changing one changes WHAT the archive contains
# or WHEN. Key names deliberately match the LLD so the two can be read together.
#
# Values are the LLD's *staging* column, which is what a laptop can demonstrate;
# the production value is noted beside each.
# ---------------------------------------------------------------------------

sourceBucket=dom-ordersystem-prod-gcs-completed-orders
sourcePrefix=order-invoices/

# LLD open question 4 - the archive bucket's location is still to be decided.
archiveBucket=dom-invoice-archive-poc

# T-90. Firm in the LLD on the strength of "97% of reads inside 90 days", which
# is itself open question 1: that figure has no traceable source yet.
cutoffDays=90

# Tar size does not affect cost - operations bill per count, not per byte.
# Production 6GiB / 100000.
targetBundleBytes=1073741824
maxBundleMembers=20000

# Partitioning. Monthly is firm: 12-56 M rows per partition against ~170 M if
# quarterly. 24 live partitions is ~760 M rows, 130-215 GB.
# Tar format version, not a folder name. Bumped only if the framing itself
# ever changes, so old bundles stay readable.
tarLayoutVersion=1

partitioning.key=cohort_date
partitioning.interval=monthly
partitioning.livePartitions=24
partitioning.premake=3
partitioning.dropPolicy=detach-verify-drop

# Document kinds the Lister will archive. Still provisional: these cover every
# filename shape in order-invoices/, but not the legacy prefixes.
docKinds=INVOICE,CN_DN
docFormats=pdf,html

# Never archived - not tax documents. The Lister skips anything under these.
#   completed-orders-map/   309 M route PNGs, 29.85 TiB
#   invoice-assets/  christmas*/  customer-*-report-pdf/
excludedPrefixes=completed-orders-map/,invoice-assets/,christmas,customer-
