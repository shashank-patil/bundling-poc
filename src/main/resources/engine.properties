# ---------------------------------------------------------------------------
# ENGINEERING CONFIGURATION
#
# Everything the LLD does not specify. Internal tuning only - none of it
# changes what the archive contains, and none of it needs a design review.
#
# The design values live in archival.yaml, which is a verbatim copy of the
# LLD's archive: block.
# ---------------------------------------------------------------------------

# Source database. Small on purpose: a backfill must never starve OMS's own
# traffic, and a page must never become a long-running statement on a replica.
db.poolSize=4
db.statementTimeout=30s

# Keyset page size for the worklist query. A day is never read in one statement.
listerPageSize=20000

# Read buffer the writer copies through. Independent of uploadChunkBytes, which
# the LLD fixes because GCS resumable upload constrains it.
io.copyBufferBytes=1048576
