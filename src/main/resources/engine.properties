# ---------------------------------------------------------------------------
# ENGINEERING CONFIGURATION
#
# Tuning only. Nothing here changes what the archive contains - these are the
# knobs for how hard the job pushes and how it protects what it reads.
# Safe to change without a design review.
# ---------------------------------------------------------------------------

# Bundler pipeline. 32 readers sustain ~400 objects/sec, well under the ~5,000
# reads/sec per bucket GCS documents as a starting capacity. The queue is
# bounded in BYTES, not rows, so the heap stays flat whatever the bundle size:
# 64 MiB queue + 16 MiB upload chunk + in-flight reads inside a 512 MB heap.
# Production fetchConcurrency 32; the LLD's staging column is 8.
fetchConcurrency=32
queueBytes=67108864

# Firm - GCS resumable upload requires a multiple of 256 KiB. Validated at boot.
uploadChunkBytes=16777216

# A day takes ~80 min, so an hourly run spans two slots; Forbid stops two pods
# overlapping. The bundler stops claiming new work once the budget is spent.
runBudgetMinutes=45
leaseMinutes=120
maxAttempts=5

# Verification check 6 - extract and crc32c every member. 1.0 verifies all of
# them; the LLD drops this to 0.01 once the job is boring. 0 disables it, which
# is where the initial rollout parks it.
verifySampleRatio=0.0

# Source database. Small on purpose: a backfill must never starve OMS's own
# traffic, and a page must never become a long-running statement on a replica.
db.poolSize=4
db.statementTimeout=30s
listerPageSize=20000
