# ---------------------------------------------------------------------------
# ENGINEERING CONFIGURATION
#
# Tuning only. Nothing here changes what the archive contains - these are the
# knobs for how hard the job pushes and how it protects the databases it reads.
# Safe to change without a design review.
# ---------------------------------------------------------------------------

# Source database. Small on purpose: a backfill must never starve OMS's own
# traffic, and a page must never become a long-running statement on a replica.
db.pool.size=4
db.statement.timeout=30s

# Keyset page size for the worklist query. A day is never read in one statement.
lister.page.size=20000

# Bundler. The queue is bounded in bytes, not rows, so the heap stays flat
# whatever the bundle size.
bundler.readers=32
bundler.queue.bytes=67108864
bundler.chunk.bytes=16777216
bundler.lease.minutes=120

# Verification check 6 - extract and crc32c every member. Parked for the initial
# rollout; when enabled it runs last and drops to a sample.
verify.full.byte.scan=false
verify.sample.size=500
