apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: archival
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: archival
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB,       value: archival }
            - { name: POSTGRES_USER,     value: archival }
            - { name: POSTGRES_PASSWORD, value: archival }
            - { name: PGDATA,            value: /var/lib/postgresql/data/pgdata }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "archival", "-d", "archival"]
            initialDelaySeconds: 3
            periodSeconds: 3
