# The two config files from the image, surfaced as a ConfigMap so the design
# values are visible and reviewable in the cluster rather than baked away.
apiVersion: v1
kind: ConfigMap
metadata:
  name: archival-env
  namespace: archival
data:
  DB_URL: jdbc:postgresql://postgres.archival.svc.cluster.local:5432/archival
  DB_USER: archival
  DB_PASSWORD: archival
  SOURCE_ROOT: /data/sources
  ARCHIVE_ROOT: /data/bundles
  # Design values, overriding archival.properties for the demo. Names follow
  # the LLD's archive: block, upper-snake-cased.
  TARGET_BUNDLE_BYTES: "1073741824"
  MAX_BUNDLE_MEMBERS: "20000"
  CUTOFF_DAYS: "90"
  # Engineering values, overriding engine.properties. Eight readers rather than
  # 32 is the LLD's own staging column, and it keeps the demo gentle on a laptop.
  FETCH_CONCURRENCY: "8"
  QUEUE_BYTES: "67108864"
  RUN_BUDGET_MINUTES: "10"
