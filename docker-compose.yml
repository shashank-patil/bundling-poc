services:
  postgres:
    image: postgres:16-alpine
    container_name: bundling-poc-db
    environment:
      POSTGRES_DB: archival
      POSTGRES_USER: archival
      POSTGRES_PASSWORD: archival
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archival -d archival"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
